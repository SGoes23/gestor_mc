server:
  port: 8080

spring:
  application:
    name: gestor-mc-api
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    # Troque em producao com valor seguro vindo de variavel de ambiente.
    secret: ${JWT_SECRET:change-this-secret-key-with-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
