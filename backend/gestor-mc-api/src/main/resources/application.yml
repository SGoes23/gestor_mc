server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: gestor-mc-api
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    # Troque em producao com valor seguro vindo de variavel de ambiente.
    secret: ${JWT_SECRET:change-this-secret-key-with-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

storage:
  accounts-payable:
    bucket: ${B2_BUCKET:gestor-mc-contas}
    endpoint: ${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
    region: ${B2_REGION:us-east-005}
    access-key: ${B2_ACCESS_KEY:}
    secret-key: ${B2_SECRET_KEY:}
