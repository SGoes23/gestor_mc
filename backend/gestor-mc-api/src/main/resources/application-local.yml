# mvn spring-boot:run "-Dspring-boot.run.profiles=local"
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    activate:
      on-profile: local
  application:
    name: gestor-mc-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestor_mc}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:gestor_mc}
    password: ${DB_PASSWORD:gestor_mc_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
    # O banco local pode conter migrações de módulos não presentes neste checkout.
    ignore-migration-patterns:
      - "*:missing"
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-with-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

# Usuários criados automaticamente na primeira inicialização do banco local.
ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:diretoria@gestormc.local}
ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:admin123}
MEMBER_EMAIL: ${LOCAL_MEMBER_EMAIL:membro@gestormc.local}
MEMBER_PASSWORD: ${LOCAL_MEMBER_PASSWORD:membro123}

logging:
  level:
    root: INFO
    br.com.gestormc.api: DEBUG
    org.hibernate.SQL: INFO
